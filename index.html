<!DOCTYPE html>
<html>
<head>
<title>Proposal ❤️</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>❤️</span>
    <span>💗</span>
</div>

<div class="card">

    <img src="cutecat.gif" width="180" alt="Cute Cat">

    <h1 id="typing"></h1>

    <input
        id="name"
        type="text"
        placeholder="💖 Enter her name (e.g. Ayesha)"
    >

    <br><br>

    <textarea
        id="message"
        placeholder="💌 Write a sweet message from your heart..."
    ></textarea>

    <br><br>

    <button id="create">🔗 Create Link</button>

    <p id="showMessage">
        I Love You So Much 🥺💖
    </p>

    <button id="yes">Yes ❤️</button>
    <button id="no">No 🙈</button>

</div>

<br>

<button id="musicBtn">
🎵 Play Music
</button>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
